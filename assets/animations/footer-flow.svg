<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="90" viewBox="0 0 1100 90" role="img" aria-labelledby="title desc">
<title id="title">Engineering data flow</title>
<desc id="desc">A quiet animated data line with moving nodes, symbolising connected engineering systems.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55D6BE" stop-opacity=".15"/><stop offset=".5" stop-color="#55D6BE"/><stop offset="1" stop-color="#8B7CF6" stop-opacity=".15"/></linearGradient></defs>
<path d="M20 45H1080" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
<g fill="#55D6BE">
 <circle cx="150" cy="45" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="380" cy="45" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin=".5s" repeatCount="indefinite"/></circle>
 <circle cx="720" cy="45" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
 <circle cx="950" cy="45" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
</g>
<circle cx="20" cy="45" r="3" fill="#8B7CF6"/><circle cx="1080" cy="45" r="3" fill="#8B7CF6"/>
</svg>