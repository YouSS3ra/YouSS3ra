<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Youssra Hamidouche — Software Engineering and Artificial Intelligence</title>
<desc id="desc">A dark blue technical banner with the author's name on the left and a luminous three-dimensional geometric object on the right.</desc>
