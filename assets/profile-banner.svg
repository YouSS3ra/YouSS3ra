<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Youssra Hamidouche — Engineering meets Intelligence</title>
  <desc id="desc">A dark abstract network diagram representing software engineering and artificial intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a32"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="115" r="250" fill="url(#glow)"/>
  <g stroke="#64748b" stroke-opacity=".32" stroke-width="1.5" fill="none">
    <path d="M760 64 L890 120 L1030 70 L1130 145 L1000 235 L850 210 L760 285"/>
    <path d="M890 120 L850 210 L1000 235 L1130 145"/>
    <path d="M1030 70 L1000 235"/>
    <path d="M760 64 L850 210"/>
  </g>
  <g fill="#0f172a" stroke="url(#accent)" stroke-width="2">
    <circle cx="760" cy="64" r="8"/><circle cx="890" cy="120" r="10"/>
    <circle cx="1030" cy="70" r="8"/><circle cx="1130" cy="145" r="10"/>
    <circle cx="1000" cy="235" r="12"/><circle cx="850" cy="210" r="9"/>
    <circle cx="760" cy="285" r="8"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="105" fill="#93c5fd" font-size="16" font-weight="600" letter-spacing="4">SOFTWARE ENGINEERING  ×  AI</text>
    <text x="72" y="174" fill="#f8fafc" font-size="52" font-weight="700">Youssra Hamidouche</text>
    <text x="76" y="220" fill="#cbd5e1" font-size="21">Designing systems. Building useful intelligence.</text>
    <rect x="76" y="263" width="220" height="3" rx="2" fill="url(#accent)"/>
    <text x="76" y="302" fill="#94a3b8" font-size="14" letter-spacing="2">COMPUTER ENGINEERING · MOROCCO</text>
  </g>
</svg>